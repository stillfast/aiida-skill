id: t3-diagnose-partition
title: "Diagnose a paused job after five failed sbatch submissions (no partition)"
weight_total: 12
checks:
  - name: "identifies the missing queue_name / partition"
    weight: 3
    any:
      - "queue_name"
      - "分区|partition"
  - name: "says the scheduler options never reached the child CalcJob"
    weight: 3
    any:
      - "metadata\\.options"
      - "options.*(没有|未|丢失|丢|没传|not).*(传|propagat|子|child)"
  - name: "(bonus) names get_builder_restart / the dynamic namespace as how options get lost"
    weight: 2
    any:
      - "get_builder_restart"
      - "dynamic|动态命名空间|dynamic namespace"
  - name: "fix: kill and resubmit (and notes that play cannot pick up new options)"
    weight: 2
    any:
      - "(kill|终止|停掉).*(重提|重新提交|resubmit|重新建)"
      - "play.{0,20}(拿不到|不会|复用|无法).{0,20}(选项|脚本)"
  - name: "must not suggest editing a stored node"
    weight: 2
    any:
      - "(不要|不能|不可|never).*(改|修改|edit).*(存|stored|数据库|节点)"
      - "新建.{0,6}(计算|进程|节点).*(而不是|不是).*(修改|改)"
