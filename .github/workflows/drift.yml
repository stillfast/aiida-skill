name: drift

on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  versions:
    name: upstream versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml packaging
      - id: check
        run: |
          set +e
          python install/07-check-upstream.py --json > drift.json
          python install/07-check-upstream.py --fail-on-drift
          echo "drift=$?" >> "$GITHUB_OUTPUT"
      - name: open an issue when something moved
        if: steps.check.outputs.drift != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const rows = JSON.parse(fs.readFileSync('drift.json', 'utf8'));
            const moved = rows.filter(r => r.state === 'drift');
            const body = [
              'A tracked package released a newer version than `versions.yaml`.',
              '',
              '| package | pinned | pypi |',
              '| --- | --- | --- |',
              ...moved.map(r => `| ${r.package} | ${r.pinned} | ${r.pypi} |`),
              '',
              'Checklist:',
              '- [ ] read the release notes for breaking changes',
              '- [ ] bump `versions.yaml` + `CHANGELOG.md`',
              '- [ ] re-run `examples/si-scf` and the touched references',
            ].join('\n');
            const title = `version drift: ${moved.map(r => r.package).join(', ')}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'drift',
            });
            if (!existing.data.length) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['drift'],
              });
            }

  links:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --exclude-loopback './**/*.md'
          fail: false

  sanity:
    name: scripts and data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pyyaml
      - name: compile every python script
        run: |
          python -m compileall -q install examples troubleshooting
      - name: validate yaml
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in (glob.glob('**/*.yml', recursive=True)
                       + glob.glob('**/*.yaml', recursive=True)):
              try:
                  with open(path) as handle:
                      yaml.safe_load(handle)
              except Exception as exc:
                  bad.append(f'{path}: {exc}')
          print('\n'.join(bad) if bad else 'all yaml parsed')
          sys.exit(1 if bad else 0)
          PY
      - name: references must declare a verification date
        run: |
          python - <<'PY'
          import glob, re, sys
          missing = [p for p in sorted(glob.glob('references/*.md'))
                     if not re.search(r'^---\n(?:.*\n)*?verified:', open(p).read())]
          print('missing frontmatter:', missing)
          sys.exit(1 if missing else 0)
          PY
