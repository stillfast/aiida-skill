id: t4-diagnose-scf302
title: "Diagnose ABACUS exit 302 with DRHO oscillating between 0.03 and 0.45"
weight_total: 12
checks:
  - name: "302 = SCF not converged (scf_nmax exhausted)"
    weight: 3
    any:
      - "302.*(SCF|电子步|收敛)"
  - name: "reads the DRHO column to identify charge sloshing"
    weight: 2
    any:
      - "DRHO|drho"
  - name: "prescribes mixing: broyden + small mixing_beta + ndim/gg0"
    weight: 3
    any:
      - "mixing_beta"
  - name: "raises scf_nmax or the wall clock, and mentions 301 (killed)"
    weight: 2
    any:
      - "scf_nmax"
      - "301|墙钟|wallclock|wall clock"
  - name: "says convergence must be verified before reporting energies"
    weight: 2
    any:
      - "(确认|检查|verify).*(收敛|convergen)"
