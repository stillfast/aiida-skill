id: t2-build-builder
title: "Build a single-point SCF builder for Si with abacus"
weight_total: 12
checks:
  - name: "a real abacus entry point (abacus.base or abacus.abacus, not bare 'abacus')"
    weight: 3
    any:
      - "abacus\\.base"
      - "abacus\\.abacus"
      - "WorkflowFactory\\(['\\\"]abacus"
      - "CalculationFactory\\(['\\\"]abacus\\.abacus"
  - name: "structure/code/parameters attached at a valid place (WorkChain abacus namespace or CalcJob top level)"
    weight: 2
    any:
      - "builder\\.abacus\\.(structure|code|parameters)"
      - "builder\\.(structure|code|parameters)\\s*="
  - name: "k-points: kpoints_distance or a kpoints mesh"
    weight: 2
    any:
      - "kpoints_distance"
      - "kpoints"
  - name: "pseudos: a pseudo_family family or the pseudos namespace"
    weight: 2
    any:
      - "pseudo_family"
      - "AtomicOrbitalFamily"
      - "pseudos"
  - name: "scheduler options: metadata.options (abacus.metadata.options on a WorkChain)"
    weight: 2
    any:
      - "metadata\\.options"
  - name: "states explicitly that nothing is submitted"
    weight: 1
    any:
      - "(不提交|不运行|not submit|do not submit|只构建)"
must_not:
  - name: "must not use the non-existent entry point CalculationFactory('abacus')"
    pattern: "CalculationFactory\\(['\\\"]abacus['\\\"]\\)"
