# Human-written notes merged into exit-codes.md by regen_exit_codes.py.
# Key = the section title in the generated table, then the exit code.

"ABACUS CalcJob":
  "300":
    cause: "missing output files"
    fix: "check which file is absent from retrieved; usually the job died before writing results"
  "301":
    cause: "'Total Time' missing = the job did not finish (wall clock, OOM, MPI/UCX failure)"
    fix: "read _scheduler-stderr.txt and sacct; raise max_wallclock_seconds, lower the process count, or fix the mixing"
  "302":
    cause: "SCF did not converge within scf_nmax"
    fix: "look at the DRHO column; for metals / 5f systems use broyden + mixing_beta 0.2 + mixing_ndim 20-24 + mixing_gg0 1.5"
  "303":
    cause: "ionic relaxation ran out of steps"
    fix: "raise max_ionic_steps, or let the WorkChain restart from the latest structure"
  "410":
    cause: "SCF did not converge within the allowed number of steps"
    fix: "same as 302"
  "501":
    cause: "ionic loop converged but the final SCF did not"
    fix: "tighten the mixing or the final SCF settings; inspect the last electronic loop"

"ABACUS base WorkChain":
  "201":
    cause: "no `abacus.structure` input"
    fix: "provide the structure"
  "202":
    cause: "neither kpoints nor kpoints_distance given"
    fix: "provide one of them (kpoints_distance is in 1/Angstrom)"
  "300":
    cause: "child calculation failed and no handler recovered"
    fix: "look further down the log for the real child exit code"
  "310":
    cause: "known unrecoverable error"
    fix: "read the handler message in `verdi process report`"
  "501":
    cause: "ionic convergence reached but the final SCF exceeded thresholds"
    fix: "same as CalcJob 501"
  "710":
    cause: "electronic loop not converged but `scf_must_converge=False` (warning only)"
    fix: "decide whether an unconverged energy is acceptable"

"ABACUS relax WorkChain":
  "401":
    cause: "the relax sub-workflow failed"
    fix: "check the child base WorkChain exit code"
  "402":
    cause: "the final SCF sub-workflow failed"
    fix: "usually SCF non-convergence or a wall-clock kill in the final SCF"

"ABACUS band WorkChain":
  "601":
    cause: "the bands sub-workflow failed"
    fix: "check the bands CalcJob exit code and its retrieved files"
  "602":
    cause: "the DOS sub-workflow failed"
    fix: "same as 601"
  "603":
    cause: "the SCF failed"
    fix: "same as 601"
  "604":
    cause: "the relax failed"
    fix: "same as 601"

"VASP CalcJob":
  "333":
    cause: "VASP produced no output at all (it probably never ran)"
    fix: "check the code path, the module/spack lines in prepend-text, and srun/MPI"
  "350":
    cause: "retrieved folder missing"
    fix: "check the scheduler log; usually the job was killed or the retrieve list is wrong"
  "700":
    cause: "calculation did not reach the end (ZBRENT, electronic failure, killed)"
    fix: "read the end of OUTCAR and vasp.out; ISIF=5/6/7 Brent line search is fragile on noisy E(V) - switch to ISIF=3"
  "701":
    cause: "electronic structure not converged"
    fix: "adjust NELM/ALGO/mixing; metals need ISMEAR=1 or -5"
  "702":
    cause: "ionic relaxation not converged"
    fix: "raise NSW or check the force criterion EDIFFG"
  "703":
    cause: "VASP reported a critical error"
    fix: "follow the message (common: NaN, ZBRENT, out of memory)"
  "704":
    cause: "diagnosis outputs missing (run_status / notifications not parsed)"
    fix: "request them in parser_settings"

"VASP v2 WorkChain":
  "300":
    cause: "required output missing inside the restart loop"
    fix: "check the child CalcJob state and parser_settings"
  "401":
    cause: "maximum number of iterations exceeded (retries exhausted)"
    fix: "read the last failure in the report; raise max_iterations if appropriate"
  "404":
    cause: "two consecutive submission failures"
    fix: "almost always configuration (partition, code, ssh); run `verdi computer test` first"
  "500":
    cause: "critical output missing, state cannot be judged"
    fix: "check the retrieve list"
  "501":
    cause: "manual input change needed"
    fix: "adjust INCAR/POSCAR as the message says"
  "502":
    cause: "the last calculation did not reach the end"
    fix: "same as CalcJob 700"
  "503":
    cause: "electronic structure not converged"
    fix: "same as CalcJob 701"
  "504":
    cause: "ionic relaxation not converged"
    fix: "raise NSW or loosen EDIFFG"
  "505":
    cause: "at least one electronic step during the relaxation did not converge"
    fix: "fix electronic convergence before worrying about the ions"
  "700":
    cause: "no potential_family given"
    fix: "supply `potential_family`"
  "702":
    cause: "potential does not exist"
    fix: "check `potential_mapping` against the installed families"

"VASP v2 relax WorkChain":
  "600":
    cause: "relaxation did not converge within max_iterations"
    fix: "raise max_iterations / NSW, or use a more robust ISIF"
  "601":
    cause: "final single point has increased residual forces (may have converged to a different electronic solution)"
    fix: "warning only: check the final structure/energy, rerun the single point if needed"
